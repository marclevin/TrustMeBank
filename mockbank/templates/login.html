{% extends "base.html" %}
{% block title %}Log in to MockBank{% endblock %}
{% block wrapclass %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Log in</h1>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
    <div class="actions"><button class="btn" type="submit">Log in</button></div>
  </form>
  <p class="small muted" style="margin-top:18px">Test customer: <code>alice@example.com</code> / <code>alice123</code></p>
</div>
{% endblock %}
