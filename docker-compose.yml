services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustmebank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustmebank}
      POSTGRES_DB: trustmebank
    volumes:
      - trustmebank-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustmebank -d trustmebank"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${TRUSTMEBANK_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://trustmebank:${POSTGRES_PASSWORD:-trustmebank}@db:5432/trustmebank
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      ALLOW_NEGATIVE_BALANCES: ${ALLOW_NEGATIVE_BALANCES:-false}
      PAYMENT_PROCESSING_DELAY_SECONDS: ${PAYMENT_PROCESSING_DELAY_SECONDS:-0}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      # Lets a webhook URL of http://host.docker.internal:PORT reach an app on the host machine.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  trustmebank-db:
