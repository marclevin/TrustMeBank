name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mockbank
          POSTGRES_PASSWORD: mockbank
          POSTGRES_DB: mockbank_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mockbank"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mockbank:mockbank@localhost:5432/mockbank_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check mockbank tests alembic/env.py
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mockbank:ci .
      - run: docker run --rm --entrypoint python mockbank:ci -c "import mockbank.main; print('import ok')"
