[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustmebank"
version = "1.0.0"
description = "A simulated Open Banking style bank for a university Financial Technology course"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2,<3",
    "bcrypt>=4.1,<5",
    "httpx>=0.27,<1",
    "markdown>=3.6,<4",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5",
]

[project.scripts]
tmb = "trustmebank.cli:app"

[tool.setuptools.packages.find]
include = ["trustmebank*"]

[tool.setuptools.package-data]
trustmebank = ["templates/**/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"examples/python-app/app.py" = ["E501"]
