{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block wrapclass %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if detail %}<p class="small muted"><code>{{ detail }}</code></p>{% endif %}
  <p class="small muted">HTTP {{ status_code }}</p>
  <p><a href="/">Back to TrustMeBank</a></p>
</div>
{% endblock %}
